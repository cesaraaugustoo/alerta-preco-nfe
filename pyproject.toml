[project]
name = "alerta-preco-nfe"
description = "Relatório semanal de altas de preço a partir do XML de NF-e."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
dynamic = ["version"]
license = { file = "LICENSE" }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alerta_preco"]

[tool.setuptools.dynamic]
version = { attr = "alerta_preco.__version__" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # dados de teste ficam mais legíveis numa linha só

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["alerta_preco"]

[tool.coverage.run]
source = ["alerta_preco"]
branch = true
