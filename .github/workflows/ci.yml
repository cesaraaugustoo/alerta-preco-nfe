name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Testes com cobertura
        run: |
          python -m pip install --quiet coverage
          python -m coverage run -m unittest discover -s tests -t .
      - name: Cobertura mínima dos módulos de conta
        run: python -m coverage report --include="alerta_preco/regra.py,alerta_preco/relatorio.py,alerta_preco/xml_nota.py" --fail-under=90

  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff mypy
      - run: python -m ruff check --output-format=github .
      - name: mypy
        shell: bash
        run: |
          python -m mypy | sed -E 's/^([^:]+):([0-9]+): error: (.*)$/::error file=\1,line=\2::\3/'
